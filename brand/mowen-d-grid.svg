  <rect x="34" y="14" width="16" height="16" rx="3" fill="#F4EFE6"/>
  <rect x="14" y="34" width="16" height="16" rx="3" fill="#F4EFE6"/>
  <rect x="34" y="34" width="16" height="16" rx="3" fill="#C23B22"/>
</svg>
